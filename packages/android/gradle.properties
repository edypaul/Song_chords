# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# AndroidX package structure to make it clearer which packages are bundled with the Android operating system
android.useAndroidX=true

# Kotlin code style
kotlin.code.style=official

# Enables namespacing of each library's R class so that its R class includes only the resources declared in the library itself
android.nonTransitiveRClass=true

# Suppress compileSdk 35 compatibility warning until AGP fully supports it
android.suppressUnsupportedCompileSdk=35
